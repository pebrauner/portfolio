<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Pedro Brauner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #111;
      --border: rgba(255,255,255,0.06);
      --text: #f0ede8;
      --text-muted: rgba(240,237,232,0.45);
      --accent: #e03418;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,8,0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .nav-logo {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span { color: var(--accent); }

    .nav-back {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-back:hover { color: var(--text); }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      padding: 100px 60px;
      max-width: 1000px;
    }

    .label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(80px, 18vw, 220px);
      line-height: 0.85;
      letter-spacing: -2px;
      margin-bottom: 32px;
      color: var(--text);
    }

    .description {
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 300;
      line-height: 1.7;
      max-width: 400px;
      margin-bottom: 48px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .home-link:hover { color: var(--accent); }

    .home-link .arrow {
      transition: transform 0.2s;
    }

    .home-link:hover .arrow { transform: translateX(-4px); }

    @media (max-width: 768px) {
      nav { padding: 0 24px; }
      main { padding: 100px 24px 80px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">PB<span>.</span></a>
  <a href="/" class="nav-back">← Back to Portfolio</a>
</nav>

<main>
  <div class="label">Error 404</div>
  <h1>NOT<br>FOUND</h1>
  <p class="description">
    This page doesn't exist — or got moved. Nothing to analyze here.
  </p>
  <a href="/" class="home-link">
    <span class="arrow">←</span>
    <span>Back to Portfolio</span>
  </a>
</main>

</body>
</html>
