<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Decks — Pedro Brauner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #e03418;
      --red-hot: #ff5c2b;
      --red-glow: rgba(224, 52, 24, 0.25);
      --red-glow-soft: rgba(224, 52, 24, 0.1);
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #161616;
      --border: #1e1e1e;
      --text: #eae4dc;
      --text-dim: #b0b0b0;
    }

    html { background: var(--bg); scroll-behavior: smooth; }

    body {
      background: transparent;
      color: var(--text);
      font-family: 'Chakra Petch', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      cursor: crosshair;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--red-glow); color: var(--text); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); }
    ::-webkit-scrollbar-thumb:hover { background: var(--red); }

    /* ── FIXED OVERLAYS ── */
    #dither-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, .18) 2px,
        rgba(0, 0, 0, .18) 4px
      );
      pointer-events: none;
      z-index: 9998;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .70) 100%);
      pointer-events: none;
      z-index: 9997;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 10, .88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
    }

    .nav-logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--red);
      text-shadow: 0 0 8px var(--red-glow);
      letter-spacing: 2px;
      text-decoration: none;
    }

    .nav-back {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.25s, text-shadow 0.25s;
    }

    .nav-back:hover {
      color: var(--red);
      text-shadow: 0 0 6px var(--red-glow);
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      z-index: 1;
      padding: 140px 60px 80px;
      border-bottom: 1px solid var(--border);
    }

    .hero-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--red);
      text-shadow: 0 0 6px var(--red-glow);
      margin-bottom: 24px;
    }

    .hero h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: clamp(64px, 11vw, 128px);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text);
      line-height: 0.95;
      margin-bottom: 24px;
    }

    .hero-subtitle {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 15px;
      color: var(--text-dim);
      max-width: 480px;
      line-height: 1.8;
    }

    /* ── DECKS GRID ── */
    .decks-section {
      position: relative;
      z-index: 1;
      padding: 80px 60px 120px;
      max-width: 1100px;
    }

    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 40px;
    }

    .decks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .deck-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.25s, box-shadow 0.25s;
      text-decoration: none;
      color: inherit;
      cursor: default;
    }

    .deck-card:hover {
      border-color: var(--red);
      box-shadow: 0 0 0 1px var(--red-glow), 0 8px 32px rgba(0, 0, 0, .4);
    }

    .deck-card-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .deck-card-title {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.2;
    }

    .deck-card-desc {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.7;
      flex: 1;
    }

    .deck-card-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--red);
      text-shadow: 0 0 6px var(--red-glow);
      text-decoration: none;
      transition: gap 0.2s, color 0.2s;
    }

    .deck-card-open:hover {
      gap: 10px;
      color: var(--red-hot);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 40px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--red);
      text-shadow: 0 0 6px var(--red-glow);
      letter-spacing: 2px;
      text-decoration: none;
    }

    .footer-copy {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 14px 20px; }
      .hero { padding: 120px 24px 60px; }
      .decks-section { padding: 60px 24px 80px; }
      .decks-grid { grid-template-columns: 1fr; }
      footer { padding: 40px 24px; flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

<canvas id="dither-bg"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- NAV -->
<nav>
  <a href="https://pedrobrauner.com" class="nav-logo">PB.</a>
  <a href="https://pedrobrauner.com" class="nav-back">← Portfolio</a>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-label">Pedro Brauner / Decks</div>
  <h1>DECKS</h1>
  <p class="hero-subtitle">Strategy documents and presentations.</p>
</section>

<!-- DECKS GRID -->
<div class="decks-section">
  <div class="section-label">All Documents</div>
  <div class="decks-grid">

    <!-- Card: rdy.gg Social Media Strategy -->
    <div class="deck-card">
      <div class="deck-card-label">Internal &middot; Q2 2026</div>
      <div class="deck-card-title">rdy.gg Social Media Strategy</div>
      <p class="deck-card-desc">Full social media strategy framework for rdy.gg covering Q2–Q3 2026.</p>
      <a href="./rdy-social-strategy/" class="deck-card-open">Open &nbsp;→</a>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer>
  <a href="https://pedrobrauner.com" class="footer-logo">PB.</a>
  <span class="footer-copy">&copy; 2026 Pedro Brauner</span>
</footer>

<script src="../writing/dither-bg.js"></script>
</body>
</html>
