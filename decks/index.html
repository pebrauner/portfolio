<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decks — Pedro Brauner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #0f0f0f;
      --surface-2: #161616;
      --border: #1c1c1c;
      --card: #111;
      --card-border: #222;
      --text: #e2e2e2;
      --text-muted: #5a5a5a;
      --accent: #e03418;
      --accent-warm: #ff5c2b;
      --accent-glow: rgba(224, 52, 24, 0.1);
      --accent-glow-strong: rgba(224, 52, 24, 0.18);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--accent-glow-strong); color: var(--text); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 8, 8, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 200;
    }

    .nav-logo {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span { color: var(--accent); }

    .nav-back {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.25s;
    }

    .nav-back:hover { color: var(--text); }

    /* ── HERO ── */
    .hero {
      padding: 140px 60px 80px;
      border-bottom: 1px solid var(--border);
    }

    .hero-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(72px, 12vw, 140px);
      line-height: 0.9;
      color: var(--text);
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .hero-subtitle {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: var(--text-muted);
      max-width: 480px;
    }

    /* ── DECKS GRID ── */
    .decks-section {
      padding: 80px 60px 120px;
      max-width: 1100px;
    }

    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 40px;
    }

    .decks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .deck-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.25s, box-shadow 0.25s;
      text-decoration: none;
      color: inherit;
      cursor: default;
    }

    .deck-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-glow), 0 8px 32px rgba(0,0,0,0.4);
    }

    .deck-card-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .deck-card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
      color: var(--text);
      line-height: 1.1;
    }

    .deck-card-desc {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      flex: 1;
    }

    .deck-card-open {
      display: inline-flex;
      align-items: center;
      margin-top: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s, gap 0.2s;
      gap: 6px;
    }

    .deck-card-open:hover {
      color: var(--accent-warm);
      gap: 10px;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer-logo span { color: var(--accent); }

    .footer-copy {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 0 24px; }
      .hero { padding: 120px 24px 60px; }
      .decks-section { padding: 60px 24px 80px; }
      .decks-grid { grid-template-columns: 1fr; }
      footer { padding: 32px 24px; flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="https://pedrobrauner.com" class="nav-logo">PB<span>.</span></a>
  <a href="https://pedrobrauner.com" class="nav-back">← Portfolio</a>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-label">Pedro Brauner / Decks</div>
  <h1>DECKS</h1>
  <p class="hero-subtitle">Strategy documents and presentations.</p>
</section>

<!-- DECKS GRID -->
<div class="decks-section">
  <div class="section-label">All Documents</div>
  <div class="decks-grid">

    <!-- Card: rdy.gg Social Media Strategy -->
    <div class="deck-card">
      <div class="deck-card-label">Internal &middot; Q2 2026</div>
      <div class="deck-card-title">rdy.gg Social Media Strategy</div>
      <p class="deck-card-desc">Full social media strategy framework for rdy.gg covering Q2–Q3 2026.</p>
      <a href="./rdy-social-strategy/" class="deck-card-open">Open &nbsp;→</a>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer>
  <a href="https://pedrobrauner.com" class="footer-logo">PB<span>.</span></a>
  <span class="footer-copy">&copy; 2026 Pedro Brauner</span>
</footer>

</body>
</html>
