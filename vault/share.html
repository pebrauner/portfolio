<!DOCTYPE html>
<html lang="en" data-theme="grimoire">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>A shared list · The Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Spline+Sans+Mono:wght@400;500;600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/mana-font@1.15.7/css/mana.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink: #0b0a07; --ink-2: #120e08; --panel: #181107; --panel-2: #1f1709;
      --edge: #342a17; --edge-soft: #28200f; --parch: #ece0c4; --parch-dim: #b0a384;
      --muted: #8a8070; --faint: #5f5648; --gold: #c9a227; --gold-soft: #e3c869; --brass: #9a7b3f;
      --display: 'Grenze Gotisch', serif; --body: 'EB Garamond', Georgia, serif;
      --mono: 'Spline Sans Mono', ui-monospace, monospace;
      --label: 'Spline Sans Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--parch); font-family: var(--body);
      background: radial-gradient(1100px 700px at 50% -10%, #1a1408, var(--ink) 60%);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 34px 20px 60px; }
    .brand { display: flex; align-items: center; gap: 9px; justify-content: center; margin-bottom: 26px; }
    .brand .seal { font-size: 22px; color: var(--gold); }
    .brand .word {
      font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .5px;
      background: linear-gradient(100deg, var(--gold), var(--gold-soft) 40%, #f6e6a8 50%, var(--gold-soft) 60%, var(--gold));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .card {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--edge); border-radius: 16px; padding: 26px 26px 30px;
      box-shadow: 0 24px 60px -30px #000;
    }
    .state { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 15px; }
    .state .big { font-size: 40px; color: var(--brass); display: block; margin-bottom: 12px; }
    .head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    .kind-tag {
      font-family: var(--label); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      padding: 5px 10px; border-radius: 999px; color: var(--ink); white-space: nowrap;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    }
    .kind-tag.sell { background: linear-gradient(180deg, #d9b97a, var(--brass)); }
    h1 { font-family: var(--display); font-weight: 700; font-size: 27px; margin: 0; color: var(--parch); line-height: 1.1; }
    .owner { font-size: 14px; color: var(--brass); margin-top: 2px; }
    .sub { font-family: var(--label); font-size: 11.5px; color: var(--muted); letter-spacing: .03em; margin: 12px 0 18px; }
    .live-dot { color: var(--gold-soft); }
    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: var(--label); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); text-align: left; padding: 0 8px 8px; border-bottom: 1px solid var(--edge);
    }
    th.r, td.r { text-align: right; }
    td { padding: 9px 8px; border-bottom: 1px solid var(--edge-soft); font-size: 15px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .qty { font-family: var(--mono); color: var(--gold-soft); white-space: nowrap; }
    .nm { color: var(--parch); }
    .setbadge {
      font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase;
      border: 1px solid var(--edge); border-radius: 5px; padding: 1px 5px; margin-left: 7px; white-space: nowrap;
    }
    .foil { color: var(--gold-soft); margin-left: 6px; font-size: 12px; }
    .price { font-family: var(--mono); color: var(--parch-dim); white-space: nowrap; }
    .line { font-family: var(--mono); color: var(--gold-soft); white-space: nowrap; }
    tfoot td { border-top: 1px solid var(--edge); padding-top: 12px; font-family: var(--mono); }
    tfoot .total { color: var(--gold-soft); font-size: 16px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .btn {
      font-family: var(--label); font-size: 12px; letter-spacing: .04em; cursor: pointer;
      border: 1px solid var(--edge); background: var(--panel-2); color: var(--parch-dim);
      border-radius: 9px; padding: 9px 14px; transition: .15s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold-soft); }
    .foot { text-align: center; margin-top: 26px; font-size: 12px; color: var(--faint); }
    .foot a { color: var(--brass); text-decoration: none; }
    .foot a:hover { color: var(--gold-soft); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="seal"><i class="ms ms-counter-lore" aria-hidden="true"></i></span><span class="word">The Vault</span></div>
    <div class="card" id="card">
      <div class="state"><span class="big"><i class="ms ms-ability-investigate"></i></span>Loading shared list…</div>
    </div>
    <div class="foot">Shared from <a href="./" target="_blank" rel="noopener">The Vault</a> — a Magic: The Gathering collection tracker.</div>
  </div>

  <script>
    const SUPA_URL = 'https://yaxczuttvpvqfomhyfbg.supabase.co';
    const SUPA_KEY = 'sb_publishable_le56dg5VAp5Bmfg3BZ4XCQ_c2sSPuOu';
    const card = document.getElementById('card');

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => '$' + (Number(n) || 0).toFixed(2);
    const PRICE_SRC = { tcg: 'TCGplayer', ck: 'Card Kingdom' };

    function showState(icon, msg) {
      card.innerHTML = `<div class="state"><span class="big"><i class="ms ${icon}"></i></span>${esc(msg)}</div>`;
    }

    function render(row) {
      const d = row.data || {};
      const items = Array.isArray(d.items) ? d.items : [];
      const kind = row.kind === 'sell' ? 'sell' : 'buy';
      const verb = kind === 'sell' ? 'Selling' : 'Buying';
      const copies = items.reduce((a, i) => a + (Number(i.qty) || 0), 0);
      const total = items.reduce((a, i) => a + (Number(i.qty) || 0) * (Number(i.price) || 0), 0);
      const src = PRICE_SRC[d.priceSrc] || 'market';
      const when = row.updated_at || row.created_at;
      const dateStr = when ? new Date(when).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';

      const rows = items.map(it => {
        const q = Number(it.qty) || 0, p = Number(it.price) || 0;
        const setBadge = it.set ? `<span class="setbadge">${esc(it.set)}</span>` : '';
        const foil = it.foil ? `<span class="foil" title="Foil">✦ foil</span>` : '';
        return `<tr>
          <td class="qty">${q}×</td>
          <td><span class="nm">${esc(it.name)}</span>${setBadge}${foil}</td>
          <td class="r price">${money(p)}</td>
          <td class="r line">${money(q * p)}</td>
        </tr>`;
      }).join('');

      const empty = !items.length ? `<div class="state" style="padding:24px 0"><span class="big"><i class="ms ms-token"></i></span>This list is empty right now.</div>` : '';

      card.innerHTML = `
        <div class="head">
          <span class="kind-tag ${kind}">${verb}</span>
          <div style="flex:1;min-width:0">
            <h1>${esc(row.title || (kind === 'sell' ? 'Sell List' : 'Buy List'))}</h1>
            ${d.owner ? `<div class="owner">${esc(d.owner)}</div>` : ''}
          </div>
        </div>
        <div class="sub">${copies} card${copies === 1 ? '' : 's'} · ${money(total)} at ${esc(src)} price${row.live ? ' · <span class="live-dot">● live — updates automatically</span>' : ''}${dateStr ? ` · ${esc(dateStr)}` : ''}</div>
        ${items.length ? `<table>
          <thead><tr><th>Qty</th><th>Card</th><th class="r">Each</th><th class="r">Total</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td></td><td>${kind === 'sell' ? 'Asking total' : 'Estimated total'}</td><td></td><td class="r total">${money(total)}</td></tr></tfoot>
        </table>` : empty}
        <div class="actions">
          <button class="btn" id="copyText"><i class="ms ms-multiple"></i> Copy as text</button>
          <a class="btn" href="./" target="_blank" rel="noopener"><i class="ms ms-counter-lore"></i> Track your own collection</a>
        </div>`;

      const cp = document.getElementById('copyText');
      if (cp) cp.addEventListener('click', async () => {
        const text = items.map(it => `${it.qty} ${it.name}${it.set ? ' (' + it.set + ')' : ''}${it.foil ? ' [foil]' : ''}`).join('\n');
        try { await navigator.clipboard.writeText(text); cp.innerHTML = '<i class="ms ms-counter-gold"></i> Copied ✓'; }
        catch (e) { cp.textContent = 'Copy failed'; }
      });
    }

    (async () => {
      const code = new URLSearchParams(location.search).get('id');
      if (!code) { showState('ms-counter-shield', 'No list code in this link.'); return; }
      if (!window.supabase) { showState('ms-counter-shield', 'Could not load — please check your connection.'); return; }
      const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
      try {
        const { data, error } = await sb.rpc('get_shared_list', { p_code: code });
        if (error) { showState('ms-counter-shield', 'Could not load this list. It may have been removed.'); return; }
        if (!data || (Array.isArray(data) && !data.length)) { showState('ms-graveyard', 'This link has expired or no longer exists.'); return; }
        render(Array.isArray(data) ? data[0] : data);
      } catch (e) { showState('ms-counter-shield', 'Something went wrong loading this list.'); }
    })();
  </script>
</body>
</html>
