<!DOCTYPE html>
<html lang="en" data-theme="grimoire">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>A player profile · The Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/mana-font@1.15.7/css/mana.min.css" rel="stylesheet" />
  <script src="i18n.js?v=16"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink: #0b0a07; --ink-2: #120e08; --panel: #181107; --panel-2: #1f1709;
      --edge: #342a17; --edge-soft: #28200f; --parch: #ece0c4; --parch-dim: #b0a384;
      --muted: #8a8070; --faint: #5f5648; --gold: #c9a227; --gold-soft: #e3c869; --brass: #9a7b3f;
      --display: 'Grenze Gotisch', serif; --body: 'Spline Sans', system-ui, sans-serif;
      --mono: 'Spline Sans', system-ui, sans-serif; --label: 'Spline Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--parch); font-family: var(--body); background: var(--ink); -webkit-font-smoothing: antialiased; }
    .bg { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; filter: blur(3px) brightness(.62) saturate(.95); transform: scale(1.06); }
    .bg-veil { position: fixed; inset: 0; z-index: -1; background:
      radial-gradient(1100px 760px at 50% 6%, rgba(18,14,7,.10), rgba(8,7,4,.62) 78%),
      linear-gradient(180deg, rgba(8,7,4,.34), rgba(8,7,4,.74)); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 34px 20px 70px; }
    .brand { display: flex; align-items: center; gap: 9px; justify-content: center; margin-bottom: 24px; }
    .brand .seal { font-size: 22px; color: var(--gold); }
    .brand .word { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .5px;
      background: linear-gradient(100deg, var(--gold), var(--gold-soft) 40%, #f6e6a8 50%, var(--gold-soft) 60%, var(--gold));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: linear-gradient(180deg, rgba(31,23,9,.92), rgba(24,17,7,.94)); border: 1px solid var(--edge);
      border-radius: 16px; padding: 26px; box-shadow: 0 30px 70px -30px #000; backdrop-filter: blur(3px); }
    .state { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 15px; }
    .state .big { font-size: 40px; color: var(--brass); display: block; margin-bottom: 12px; }
    /* hero */
    .hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .avatar { width: 76px; height: 76px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-family: var(--display); font-size: 30px; color: var(--gold-soft); border: 1px solid var(--edge); flex-shrink: 0; }
    .hid { flex: 1; min-width: 0; }
    h1 { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0; color: var(--parch); line-height: 1.05; }
    .handle { font-size: 14px; color: var(--brass); margin-top: 3px; }
    .handle .ms { font-size: 12px; color: var(--muted); }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .badge { font-family: var(--label); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
      color: var(--ink); background: linear-gradient(180deg, var(--gold-soft), var(--gold)); }
    .badge.soft { color: var(--parch-dim); background: rgba(255,255,255,.03); border: 1px solid var(--edge); }
    .badge.tier { color: var(--ink); border: none; }
    .badge.tier-bronze { background: linear-gradient(180deg, #d9a066, #a4682f); }
    .badge.tier-silver { background: linear-gradient(180deg, #e4e4ea, #a7adba); }
    .badge.tier-gold { background: linear-gradient(180deg, #f4dd7a, #d4a72c); }
    .badge.tier-mythic { color: var(--parch); background: linear-gradient(180deg, #b06ad9, #7a3fb0); }
    .medal { font-size: 16px; flex-shrink: 0; }
    .bio { color: var(--parch-dim); font-size: 15px; line-height: 1.6; max-width: 640px; margin: 16px 0 0; white-space: pre-wrap; }
    .runs-store { margin: 12px 0 0; font-size: 14px; color: var(--brass); display: inline-flex; align-items: center; gap: 6px; }
    .runs-store a { color: var(--gold-soft); text-decoration: none; font-weight: 600; }
    .runs-store a:hover { text-decoration: underline; }
    /* sections */
    .sec { margin-top: 22px; }
    .sec-h { font-family: var(--label); font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--brass); margin-bottom: 11px; }
    .decks { display: flex; flex-direction: column; gap: 7px; }
    .deck { display: flex; align-items: center; gap: 9px; border: 1px solid var(--edge-soft); border-radius: 9px; padding: 9px 11px; background: var(--ink-2); }
    .deck.playing { border-color: color-mix(in srgb, var(--gold) 40%, var(--edge)); background: color-mix(in srgb, var(--gold) 7%, var(--ink-2)); }
    .deck .star { color: var(--faint); font-size: 15px; }
    .deck.playing .star { color: var(--gold); }
    .deck .dn { flex: 1; min-width: 0; }
    .deck .dname { font-size: 15px; color: var(--parch); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .deck .dsub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    a.deck.linked { text-decoration: none; color: inherit; transition: .15s; }
    a.deck.linked:hover { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--ink-2)); }
    .deck .dgo { font-family: var(--label); font-size: 11px; color: var(--brass); white-space: nowrap; }
    a.deck.linked:hover .dgo { color: var(--gold-soft); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font-size: 13px; color: var(--parch-dim); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 12px; }
    .chip .n { font-family: var(--mono); font-size: 11px; color: var(--ink); background: linear-gradient(180deg, var(--gold-soft), var(--gold)); border-radius: 999px; padding: 1px 6px; margin-left: 5px; }
    .tops { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .topc { text-decoration: none; }
    .topc-art { position: relative; aspect-ratio: 488/680; border-radius: 9px; overflow: hidden; border: 1px solid var(--edge); background: #0c0a07 center/cover no-repeat; box-shadow: 0 10px 24px -14px #000; transition: transform .15s; }
    .topc:hover .topc-art { transform: translateY(-3px); }
    .topc-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .topc-fb { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--faint); font-family: var(--display); font-size: 18px; text-align: center; padding: 6px; }
    .topc-cap { display: flex; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: 12px; }
    .topc-cap .tn { color: var(--parch-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topc-cap .tv { font-family: var(--mono); color: var(--gold-soft); }
    .listlinks { display: flex; gap: 10px; flex-wrap: wrap; }
    .ll { flex: 1; min-width: 150px; display: flex; align-items: center; gap: 9px; text-decoration: none; border: 1px solid var(--edge); border-radius: 11px; padding: 13px 15px; background: var(--panel-2); transition: .15s; }
    .ll:hover { border-color: var(--gold); }
    .ll .lk { font-family: var(--label); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; color: var(--ink); }
    .ll.buy .lk { background: linear-gradient(180deg, var(--gold-soft), var(--gold)); }
    .ll.sell .lk { background: linear-gradient(180deg, #d9b97a, var(--brass)); }
    .ll .lt { flex: 1; min-width: 0; color: var(--parch); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ll .lgo { color: var(--brass); }
    .foot { text-align: center; margin-top: 26px; font-size: 12px; color: var(--faint); }
    .foot a { color: var(--brass); text-decoration: none; }
    .foot a:hover { color: var(--gold-soft); }
    @media (max-width: 480px) { h1 { font-size: 24px; } .tops { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); } }
  </style>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="bg-veil" aria-hidden="true"></div>
  <div class="wrap">
    <div class="brand"><span class="seal"><i class="ms ms-counter-lore" aria-hidden="true"></i></span><span class="word">The Vault</span></div>
    <div class="card" id="card">
      <div class="state"><span class="big"><i class="ms ms-ability-investigate"></i></span><span data-i18n="Loading profile…">Loading profile…</span></div>
    </div>
    <div class="foot" data-i18n-html="A &lt;a href=&quot;./&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Vault&lt;/a&gt; player profile — Magic: The Gathering collection tracker.">A <a href="./" target="_blank" rel="noopener">Vault</a> player profile — Magic: The Gathering collection tracker.</div>
  </div>

  <script>
    I18N.lang = I18N.detect();
    document.documentElement.lang = I18N.lang;
    I18N.apply(document);

    const SUPA_URL = 'https://yaxczuttvpvqfomhyfbg.supabase.co';
    const SUPA_KEY = 'sb_publishable_le56dg5VAp5Bmfg3BZ4XCQ_c2sSPuOu';
    const cardEl = document.getElementById('card');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => '$' + (Number(n) || 0).toFixed(2);
    const safeUrl = (u) => { u = String(u || ''); return /^https?:\/\//i.test(u) ? u : ''; };
    const EXP = { new: 'New to Magic', intermediate: 'Intermediate', veteran: 'Veteran' };   // keys are stored values; labels translated at display via tr()
    let WINS = null;

    function tierFor(wins) {
      if (wins >= 25) return { cls: 'tier-mythic', label: tr('Mythic') };
      if (wins >= 10) return { cls: 'tier-gold', label: tr('Gold') };
      if (wins >= 5) return { cls: 'tier-silver', label: tr('Silver') };
      if (wins >= 1) return { cls: 'tier-bronze', label: tr('Bronze') };
      return null;
    }

    async function loadWins(username) {
      if (!username) return;
      try {
        const sb = window.__sb;
        if (!sb) return;
        const { data, error } = await sb.rpc('get_user_wins', { p_username: username });
        if (error || !data) return;
        const wins = Number(data.wins) || 0;
        const recent = Array.isArray(data.recent) ? data.recent : [];
        if (wins <= 0 && !recent.length) return;   // nothing to show — leave page as-is
        WINS = { wins, podiums: Number(data.podiums) || 0, recent };
        injectWins(WINS);
      } catch (e) { /* degrade gracefully — never crash */ }
    }

    function injectWins(w) {
      // Badge in the .badges row
      if (w.wins > 0) {
        const badgesEl = cardEl.querySelector('.badges');
        if (badgesEl) {
          const winLabel = w.wins === 1
            ? tr('🏆 Winner of 1 tournament')
            : tr('🏆 Winner of {n} tournaments', { n: w.wins });
          let extra = `<span class="badge">${esc(winLabel)}</span>`;
          const tier = tierFor(w.wins);
          if (tier) extra += `<span class="badge tier ${tier.cls}">${esc(tier.label)}</span>`;
          badgesEl.insertAdjacentHTML('beforeend', extra);
        }
      }
      // Recent wins section
      if (w.recent.length) {
        const medals = { 1: '🏆', 2: '🥈', 3: '🥉' };
        const rows = w.recent.map(r => {
          const medal = medals[Number(r.placement)] || '🏅';
          const title = esc(r.event_title || tr('Tournament'));
          const subParts = [];
          if (r.store_name) {
            const slugOk = /^[a-z0-9-]{3,40}$/.test(String(r.store_slug || ''));
            const storeLink = slugOk
              ? `<a href="s.html?s=${encodeURIComponent(r.store_slug)}">${esc(r.store_name)}</a>`
              : esc(r.store_name);
            subParts.push(tr('at {store}', { store: storeLink }));
          }
          if (r.starts_at) {
            const dt = new Date(r.starts_at);
            if (!isNaN(dt)) subParts.push(esc(dt.toLocaleDateString(I18N.locale(), { year: 'numeric', month: 'short', day: 'numeric' })));
          }
          return `<div class="deck"><span class="medal">${medal}</span><div class="dn"><div class="dname">${title}</div><div class="dsub">${subParts.join(' · ')}</div></div></div>`;
        }).join('');
        const sec = document.createElement('div');
        sec.className = 'sec';
        sec.innerHTML = `<div class="sec-h">${esc(tr('Tournament results'))}</div><div class="decks">${rows}</div>`;
        cardEl.appendChild(sec);
      }
    }

    const BG = ['grimoire','abstract','arcane','tome','tome2','ember','space1','space2','space3','space4','space5',
      'manamist1','manamist2','manamist3','manamist4','manamist5','mountain1','mountain2','mountain3','mountain4','archway1','archway2','archway3'];
    document.getElementById('bg').style.backgroundImage = `url("bg/${BG[Math.floor(Math.random() * BG.length)]}.jpg")`;

    function initials(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '✦';
      return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }
    function showState(icon, msg) { cardEl.innerHTML = `<div class="state"><span class="big"><i class="ms ${icon}"></i></span>${esc(msg)}</div>`; }

    function render(d) {
      const name = d.full_name || d.display_name || d.username || tr('A player');
      const loc = [d.city, d.country].filter(Boolean).join(', ');
      const since = d.since ? new Date(d.since).toLocaleDateString(I18N.locale(), { month: 'long', year: 'numeric' }) : '';
      const hue = Number(d.avatarHue) || 40;
      const fmts = Array.isArray(d.formats) ? d.formats : [];
      const badges = [EXP[d.experience] ? `<span class="badge">${esc(tr(EXP[d.experience]))}</span>` : '']
        .concat(fmts.slice(0, 5).map(f => `<span class="badge soft">${esc(tr(f))}</span>`))
        .concat(since ? [`<span class="badge soft">${esc(tr('Member since {date}', { date: since }))}</span>`] : []).join('');

      let html = `<div class="hero">
        <div class="avatar" style="background:linear-gradient(160deg, hsl(${hue} 45% 26%), hsl(${hue} 45% 15%))">${esc(initials(name))}</div>
        <div class="hid"><h1>${esc(name)}</h1>
          <div class="handle">@${esc(d.username || '')}${loc ? ` · <i class="ms ms-land"></i> ${esc(loc)}` : ''}</div>
          <div class="badges">${badges}</div></div></div>`;
      if (d.bio) html += `<p class="bio">${esc(d.bio)}</p>`;
      if (d.store && /^[a-z0-9-]{3,40}$/.test(String(d.store.slug || ''))) html += `<p class="runs-store"><i class="ms ms-counter-lore"></i> ${tr('Runs {store}', { store: `<a href="s.html?s=${encodeURIComponent(d.store.slug)}">${esc(d.store.name || tr('a store'))}</a>` })}</p>`;

      if (Array.isArray(d.lists) && d.lists.length) {
        html += `<div class="sec"><div class="sec-h">${esc(tr('Trade lists'))}</div><div class="listlinks">${d.lists.map(l => {
          const url = safeUrl(l.url); if (!url) return '';
          const buy = l.kind !== 'sell';
          return `<a class="ll ${buy ? 'buy' : 'sell'}" href="${esc(url)}" target="_blank" rel="noopener">
            <span class="lk">${esc(buy ? tr('Buying') : tr('Selling'))}</span><span class="lt">${esc(l.title || (buy ? tr('Buy List') : tr('Sell List')))}</span><span class="lgo">↗</span></a>`;
        }).join('')}</div></div>`;
      }
      if (Array.isArray(d.decks) && d.decks.length) {
        html += `<div class="sec"><div class="sec-h">${esc(tr('Playing'))}</div><div class="decks">${d.decks.map(dk => {
          const code = /^[A-Za-z0-9]{4,16}$/.test(String(dk.code || '')) ? dk.code : '';
          const cnt = Number(dk.count) || 0;
          const cntLabel = cnt === 1 ? tr('{n} card', { n: cnt }) : tr('{n} cards', { n: cnt });
          const inner = `<span class="star">★</span><div class="dn"><div class="dname">${esc(dk.name)}</div><div class="dsub">${esc(cntLabel)}${dk.commander ? ' · ' + esc(dk.commander) : ''}</div></div>${code ? `<span class="dgo">${esc(tr('View ↗'))}</span>` : ''}`;
          return code
            ? `<a class="deck linked ${dk.playing ? 'playing' : ''}" href="d.html?id=${encodeURIComponent(code)}">${inner}</a>`
            : `<div class="deck ${dk.playing ? 'playing' : ''}">${inner}</div>`;
        }).join('')}</div></div>`;
      }
      if (Array.isArray(d.stores) && d.stores.length) {
        html += `<div class="sec"><div class="sec-h">${esc(tr('Plays at'))}</div><div class="chips">${d.stores.map(s =>
          `<span class="chip">${esc(s.name)}${s.count ? `<span class="n">${Number(s.count) || 0}</span>` : ''}</span>`).join('')}</div></div>`;
      }
      if (Array.isArray(d.topCards) && d.topCards.length) {
        html += `<div class="sec"><div class="sec-h">${esc(tr('Top cards'))}</div><div class="tops">${d.topCards.map(c => {
          const img = safeUrl(c.img), uri = safeUrl(c.uri);
          const art = img ? `<img src="${esc(img)}" alt="${esc(c.name)}" loading="lazy" />` : `<div class="topc-fb">${esc(c.name)}</div>`;
          const tag = uri ? 'a' : 'div';
          const href = uri ? ` href="${esc(uri)}" target="_blank" rel="noopener"` : '';
          return `<${tag} class="topc"${href}><div class="topc-art">${art}</div><div class="topc-cap"><span class="tn">${esc(c.name)}</span><span class="tv">${money(c.value)}</span></div></${tag}>`;
        }).join('')}</div></div>`;
      }
      cardEl.innerHTML = html;
    }

    (async () => {
      const u = new URLSearchParams(location.search).get('u');
      if (!u) { showState('ms-counter-shield', tr('No profile named in this link.')); return; }
      if (!window.supabase) { showState('ms-counter-shield', tr('Could not load — please check your connection.')); return; }
      const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
      window.__sb = sb;
      try {
        const { data, error } = await sb.rpc('get_public_profile', { p_username: u });
        if (error) { showState('ms-counter-shield', tr('Could not load this profile.')); return; }
        if (!data) { showState('ms-graveyard', tr('This profile is private or doesn’t exist.')); return; }
        document.title = ((data.display_name || data.username || tr('Player')) + ' · The Vault');
        render(data);
        loadWins(data.username);   // fire-and-forget; degrades gracefully
      } catch (e) { showState('ms-counter-shield', tr('Something went wrong loading this profile.')); }
    })();
  </script>
</body>
</html>
